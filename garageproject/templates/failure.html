<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Failure</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8d7da;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h1 {
            color: #dc3545;
        }

        p {
            margin: 15px 0;
        }

        a {
            text-decoration: none;
            color: white;
            background: #dc3545;
            padding: 10px 20px;
            border-radius: 5px;
        }

        a:hover {
            background: #b02a37;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>❌ Login Failed</h1>
        <p>Invalid email or password. Please try again.</p>
        <a href="/login/">Go Back</a>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Garage Buddy Login</title>
  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?family=Satoshi:300,400,500,700&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --bg: #f4f6f8;
      --bg-2: #eef2f5;
      --surface: rgba(255,255,255,.9);
      --surface-2: rgba(255,255,255,.72);
      --border: rgba(18,24,33,.10);
      --text: #171b22;
      --muted: #667085;
      --primary: #12b8b0;
      --primary-2: #0f8f89;
      --shadow: 0 18px 50px rgba(15,23,42,.10);
      --radius: 24px;
      --font: 'Satoshi', Inter, system-ui, sans-serif;
    }
    [data-theme="dark"] {
      --bg: #0d1117;
      --bg-2: #121722;
      --surface: rgba(17,21,29,.78);
      --surface-2: rgba(20,25,34,.66);
      --border: rgba(255,255,255,.08);
      --text: #edf2f7;
      --muted: #a8b3c2;
      --primary: #22d3c5;
      --primary-2: #10a9a0;
      --shadow: 0 22px 60px rgba(0,0,0,.32);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--font);
      color: var(--text);
      background:
        radial-gradient(circle at 18% 18%, rgba(34,211,197,.18), transparent 24%),
        radial-gradient(circle at 82% 20%, rgba(255,255,255,.05), transparent 20%),
        linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
      background-attachment: fixed;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }

    .page {
      min-height: 100dvh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 1.2rem;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.04), transparent);
      backdrop-filter: blur(14px);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: .9rem;
      min-width: 0;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      flex: 0 0 auto;
      background: rgba(255,255,255,.04);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand h1 {
      font-size: 1.05rem;
      line-height: 1.1;
    }

    .brand p {
      font-size: .83rem;
      color: var(--muted);
      margin-top: .12rem;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      padding: .8rem 1rem;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      box-shadow: var(--shadow);
    }

    .content {
      display: grid;
      place-items: center;
      padding: clamp(1.2rem, 3vw, 2.25rem);
    }

    .login-shell {
      width: min(1180px, 100%);
      display: grid;
      grid-template-columns: 1.05fr .95fr;
      gap: 1.25rem;
      align-items: stretch;
    }

    .hero, .form-card {
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 30px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      overflow: hidden;
    }

    .hero {
      padding: clamp(1.5rem, 3vw, 2.5rem);
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: auto -10% -30% auto;
      width: 360px;
      height: 360px;
      background: radial-gradient(circle, rgba(34,211,197,.18), transparent 65%);
      pointer-events: none;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      padding: .55rem .85rem;
      border-radius: 999px;
      border: 1px solid rgba(34,211,197,.22);
      background: rgba(34,211,197,.10);
      color: var(--primary);
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .hero h2 {
      font-size: clamp(2rem, 1.5rem + 2vw, 3.4rem);
      line-height: 1.05;
      letter-spacing: -.03em;
      max-width: 11ch;
      margin-top: .8rem;
    }

    .hero p {
      margin-top: 1rem;
      color: var(--muted);
      max-width: 56ch;
    }

    .hero-grid {
      margin-top: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1rem;
    }

    .stat {
      border-radius: 22px;
      padding: 1rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    .stat span {
      display: block;
      color: var(--muted);
      font-size: .85rem;
      margin-bottom: .3rem;
    }

    .stat strong {
      font-size: 1.5rem;
    }

    .form-wrap {
      padding: clamp(1.4rem, 3vw, 2.25rem);
      display: grid;
      place-items: center;
    }

    .form-card {
      width: 100%;
      max-width: 520px;
      padding: clamp(1.5rem, 3vw, 2.2rem);
      position: relative;
      background: rgba(12,16,22,.88);
    }

    .section-title {
      margin-bottom: 1.3rem;
    }

    .section-title h3 {
      font-size: 1.8rem;
      letter-spacing: -.02em;
    }

    .section-title p {
      margin-top: .35rem;
      color: var(--muted);
      font-size: .95rem;
    }

    .field {
      display: grid;
      gap: .5rem;
      margin-bottom: 1rem;
    }

    .field label {
      font-size: .92rem;
      color: var(--muted);
    }

    .input {
      height: 54px;
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: 0 1rem;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.04);
    }

    .input:focus-within {
      border-color: rgba(34,211,197,.48);
      box-shadow: 0 0 0 4px rgba(34,211,197,.12);
    }

    .input span {
      color: #8e99aa;
    }

    .input input {
      width: 100%;
      background: transparent;
      border: 0;
      outline: 0;
      color: var(--text);
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: .8rem;
      align-items: center;
      margin: .2rem 0 1rem;
    }

    .remember {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      color: var(--muted);
      font-size: .92rem;
    }

    .remember input {
      accent-color: var(--primary);
    }

    .forgot {
      color: var(--primary);
      font-size: .92rem;
      font-weight: 600;
    }

    .btn {
      width: 100%;
      height: 54px;
      border-radius: 18px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      transition: transform .2s ease, opacity .2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 72%, white));
      color: #071315;
      box-shadow: 0 18px 38px rgba(34,211,197,.22);
    }

    .btn-secondary {
      margin-top: .85rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: .8rem;
      margin: 1rem 0;
      color: var(--muted);
      font-size: .78rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .footer {
      margin-top: 1rem;
      text-align: center;
      color: var(--muted);
      font-size: .94rem;
    }

    .footer a {
      color: var(--primary);
      font-weight: 700;
    }

    @media (max-width: 980px) {
      .login-shell {
        grid-template-columns: 1fr;
      }
      .hero h2 {
        max-width: 14ch;
      }
    }

    @media (max-width: 640px) {
      .topbar {
        padding: 0 .9rem;
      }
      .brand p {
        display: none;
      }
      .row {
        flex-direction: column;
        align-items: flex-start;
      }
      .hero-grid {
        grid-template-columns: 1fr;
      }
    }
  .hero-image-box {
  width: 100%;
  max-width: 520px;
  min-height: 420px;
  padding: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 28px;
  background: rgba(255,255,255,0.03);
  overflow: hidden;
  box-shadow: 0 16px 40px rgba(0,0,0,0.18);
  margin: 0 auto;
}

.hero-image-box img {
  max-width: 95%;
  max-height: 95%;
  object-fit: cover;
  object-position: center;
  border-radius: 20px;
  display: block;
}
  </style>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <div class="logo">
          <img src="https://static.vecteezy.com/system/resources/previews/054/553/620/non_2x/automotive-garage-logo-design-template-vector.jpg" alt="Garage Buddy Logo" />
        </div>
        <div>
          <h1>Garage Buddy</h1>
          <p>Garage Management System</p>
        </div>
      </div>
      <a class="back-btn" href="/home/">
        ← Back
      </a>
    </header>

    <main class="content">
      <section class="login-shell">
        <div class="hero">
          <div class="hero-badge">Secure access</div>
          <h2>Welcome Buddy !!!!</h2>
          <p>Log in to manage customers, vehicles, billing, and service work in one clean dashboard.</p>

          <div class="hero-grid">
           <div class="hero-image-box">
  <img src="https://sianty.com/wp-content/uploads/2025/06/leading-workshop-management-solution.png" alt="Garage work image" />
</div>
          </div>
        </div>

        <div class="form-wrap">
          <div class="form-card">
            <div class="section-title">
              <h3>Welcome back</h3>
              <p>Enter your login details to continue.</p>
            </div>

            <form action="/authenticate/" method="POST">
              {% csrf_token %}
              <div class="field">
                <label for="email">Email</label>
                <div class="input">
                  <span>✉️</span>
                  <input id="email" name="Email" type="email" placeholder="Enter your email" required />
                </div>
              </div>

              <div class="field">
                <label for="password">Password</label>
                <div class="input">
                  <span>🔒</span>
                  <input id="password" name="password" type="password" placeholder="Enter your password" required />
                </div>
              </div>

              <div class="row">
                <label class="remember"><input type="checkbox" /> Remember me</label>
                <a class="forgot" href="#">Forgot password?</a>
              </div>

              <button class="btn btn-primary" type="submit">Log in</button>
              <div class="divider">or</div>
              <button class="btn btn-secondary" type="button">Continue with Google</button>
              <p class="footer">New here? <a href="/signup/">Create account</a></p>
            </form>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
